name: JEPA examples

on:
  push:
    paths:
      - '01-model-architecture/learning-jepa/**'
      - '.github/workflows/jepa-examples.yml'
  pull_request:
    paths:
      - '01-model-architecture/learning-jepa/**'
      - '.github/workflows/jepa-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 01-model-architecture/learning-jepa/requirements.txt
      - name: Install tested CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r 01-model-architecture/learning-jepa/requirements.txt
      - name: Check teaching model and experiment entrypoint
        working-directory: 01-model-architecture/learning-jepa
        run: |
          python -m pytest tests -q
          python examples/tiny_jepa.py --steps 2 --seeds 0 --output "$RUNNER_TEMP/jepa-smoke.json"
      - name: Check pinned official model APIs
        run: |
          git clone https://github.com/facebookresearch/ijepa.git "$RUNNER_TEMP/ijepa"
          git -C "$RUNNER_TEMP/ijepa" checkout --detach 52c1ae95d05f743e000e8f10a1f3a79b10cff048
          python 01-model-architecture/learning-jepa/examples/official_smoke.py --ijepa-root "$RUNNER_TEMP/ijepa"
